name: LitraKitDemo
options:
  bundleIdPrefix: dev.litrakit
  deploymentTarget:
    iOS: "16.0"
packages:
  LitraKit:
    path: ../..
targets:
  LitraKitDemo:
    type: application
    platform: iOS
    sources: [LitraKitDemo]
    dependencies:
      - package: LitraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.litrakit.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
